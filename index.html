<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Explorer – Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
  <header id="site-header" class="relative"></header>

  <!-- Hero (Lab 1.1) -->
  <section class="bg-gradient-to-br from-amber-100 to-orange-150 text-stone-900">
    <div class="mx-auto max-w-6xl px-4 py-12 text-center sm:py-16 lg:py-24">
      <h1 class="text-3xl font-bold sm:text-4xl lg:text-5xl">Uncover your next favorite book</h1>
      <p class="mx-auto mt-4 max-w-2xl text-stone-600 sm:text-lg">
        Search millions of titles and save the ones you love.
      </p>

      <!-- Search (Lab 3.3) -->
      <form id="search-form" class="mx-auto mt-8 flex max-w-xl flex-col gap-2 sm:flex-row" role="search">
        <label for="search-input" class="sr-only">Search books by title</label>
        <input id="search-input" type="search" placeholder="Search by title, e.g. Dune"
               class="w-full rounded-lg border-0 px-4 py-3 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-white" />
        <button type="submit"
                class="rounded-lg bg-white px-6 py-3 font-semibold text-stone-700 transition hover:bg-stone-100">
          Search
        </button>
      </form>
    </div>
  </section>

  <!-- Responsive grid (Labs 1.2, 1.3, 3.2): 1 col mobile → 2 sm → 3 md → 4 lg → 5 xl -->
  <main class="mx-auto max-w-6xl px-4 py-10">
    <h2 id="results-heading" class="mb-6 text-2xl font-bold">Popular fiction</h2>
    <div id="book-grid" class="grid grid-cols-1 gap-6 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5"></div>
  </main>

  <footer id="site-footer"></footer>
  <script type="module" src="./js/home.js"></script>
</body>
</html>
