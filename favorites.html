<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Explorer – Favorites</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
  <header id="site-header" class="relative"></header>

  <main class="mx-auto max-w-6xl px-4 py-10">
    <div class="mb-6 flex flex-wrap items-end justify-between gap-3">
      <div>
        <h1 class="text-3xl font-bold">Your favorites</h1>
        <p id="favorites-count" class="text-slate-500"></p>
      </div>
      <button id="clear-all" type="button"
              class="hidden rounded-lg border border-slate-300 px-4 py-2 text-sm text-slate-600 hover:bg-white">
        Clear all
      </button>
    </div>
    <div id="favorites-grid" class="grid grid-cols-1 gap-6 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5"></div>
  </main>

  <footer id="site-footer"></footer>
  <script type="module" src="./Favoritespage.js"></script>
</body>
</html>
